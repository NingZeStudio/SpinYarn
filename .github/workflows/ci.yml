name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # Mappings are not committed. Unit-test snapshots + integration tests need
      # a small subset; download only those versions to keep CI fast.
      - name: Download test mappings
        run: |
          bash scripts/download_mappings.sh 1.21.9 1.21.11 1.18.2-pre1 1.21.3 1.21.4 1.14.4

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Build release
        run: cargo build --release --workspace

      - name: Integration Tests
        run: |
          chmod +x ./test.sh
          SPINYARN_BIN=./target/release/spinyarn ./test.sh

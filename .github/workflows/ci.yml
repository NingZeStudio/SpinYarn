name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # Must run before any build: build.rs embeds the mappings/ files.
      - name: Download bundled mappings
        run: bash scripts/download_mappings.sh

      - name: Verify mappings
        run: |
          ls -lh mappings/ || { echo "ERROR: mappings/ directory missing"; exit 1; }
          ls mappings/*.tiny.gz >/dev/null 2>&1 || { echo "ERROR: No mapping files found"; exit 1; }
          echo "Mappings OK"

      - name: Check
        run: cargo check --all-targets

      - name: Test
        run: cargo test --all-targets

      - name: Build release
        run: cargo build --release

      - name: Integration Tests
        run: |
          chmod +x ./test.sh
          SPINYARN_BIN=./target/release/spinyarn ./test.sh

[package]
name = "spinyarn"
version = "1.0.0-pre.2"
edition = "2021"
description = "Minecraft 日志反混淆服务（Axum Web API）"

[workspace]
members = ["crates/core", "crates/capi"]
resolver = "2"

[dependencies]
spinyarn-core = { path = "crates/core", features = ["utoipa"] }
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
utoipa = { version = "4", features = ["axum_extras"] }

[dev-dependencies]
criterion = "0.5"
flate2 = "1"

[[bench]]
name = "deobfuscate"
harness = false

[package]
name = "spinyarn-core"
version = "1.0.0-pre.2"
edition = "2021"
description = "SpinYarn 核心库：Minecraft 日志反混淆引擎（Yarn/Vanilla），无网络栈依赖"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tracing = "0.1"
flate2 = "1"
once_cell = "1"
thiserror = "2"
toml = "0.8"
utoipa = { version = "4", features = ["axum_extras"], optional = true }

[features]
default = []
utoipa = ["dep:utoipa"]
